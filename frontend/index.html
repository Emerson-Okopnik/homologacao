<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme = 'system'
        try { theme = localStorage.getItem('verigrid.theme') || 'system' } catch {}
        const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <meta name="theme-color" content="#0A1F5C" />
    <meta name="description" content="VERIGRID — projetos, documentos e pessoas conectados em um único fluxo de homologação fotovoltaica." />
    <title>VERIGRID · Homologação fotovoltaica</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
