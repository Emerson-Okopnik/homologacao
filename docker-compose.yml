name: homologa-solar

x-php-app: &php-app
  build:
    context: ./docker/php
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: homologa-solar/php:8.4
  working_dir: /var/www/backend
  volumes:
    - ./backend:/var/www/backend
  env_file:
    - ./backend/.env
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  networks: [homologa]

services:
  app:
    <<: *php-app
    container_name: homologa-app

  queue:
    <<: *php-app
    container_name: homologa-queue
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--backoff=10,60,300", "--max-time=3600"]
    restart: unless-stopped

  scheduler:
    <<: *php-app
    container_name: homologa-scheduler
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: homologa-frontend
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && exec pnpm dev"
    environment:
      VITE_BACKEND_URL: http://nginx
      VITE_USE_POLLING: "true"
      E2E_BASE_URL: http://nginx
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "--timeout=5", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [homologa]

  nginx:
    image: nginx:1.27-alpine
    container_name: homologa-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
      frontend:
        condition: service_healthy
    networks: [homologa]

  postgres:
    image: postgres:17-alpine
    container_name: homologa-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-homologa}
      POSTGRES_USER: ${DB_USERNAME:-homologa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homologa}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-homologa} -d ${DB_DATABASE:-homologa}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [homologa]

  redis:
    image: redis:7-alpine
    container_name: homologa-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_FORWARD_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [homologa]

  minio:
    build:
      context: ./docker/minio
      target: server
    image: homologa-solar/minio:RELEASE.2025-10-15T17-29-55Z
    pull_policy: build
    container_name: homologa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-homologa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-homologa-secret}
    ports:
      - "${MINIO_FORWARD_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [homologa]

  minio-init:
    build:
      context: ./docker/minio
      target: client
    image: homologa-solar/mc:RELEASE.2025-08-13T08-35-41Z
    pull_policy: build
    container_name: homologa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-homologa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-homologa-secret}
      MINIO_BUCKET: ${AWS_BUCKET:-homologa-documents}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set none local/$${MINIO_BUCKET} &&
      mc version enable local/$${MINIO_BUCKET}
      "
    networks: [homologa]

  mailpit:
    image: axllent/mailpit:latest
    container_name: homologa-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks: [homologa]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:

networks:
  homologa:
    driver: bridge
